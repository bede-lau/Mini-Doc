# EvidenceOS Mini — local infrastructure.
# Only Qdrant is required. The FastAPI app and Next.js frontend run directly
# (see README quickstart). Keeping the compose file minimal on purpose.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: evidenceos-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./data/vector_store/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
